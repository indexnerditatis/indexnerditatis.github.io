<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nerditas · Index nerditatis humanae</title>
<meta name="theme-color" content="#121A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nerditas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face{font-family:'IM Fell English';src:url(fonts/imfell-regular.ttf) format('truetype');font-style:normal;font-display:swap}
  @font-face{font-family:'IM Fell English';src:url(fonts/imfell-italic.ttf) format('truetype');font-style:italic;font-display:swap}
  @font-face{font-family:'IM Fell English SC';src:url(fonts/imfell-sc.ttf) format('truetype');font-style:normal;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrainsmono.ttf) format('truetype');font-style:normal;font-weight:100 800;font-display:swap}
  :root{
    --ink:#121A2E; --ink2:#1E2741; --line:#2E3854; --line2:#4A5576;
    --parch:#EDE6D6; --parch2:#C9C2B2; --mute:#9AA3B8; --bar:#7E89A6;
    --rub:#E2553F; --green:#7FD1A8;
    --serif:'IM Fell English', Georgia, serif;
    --sc:'IM Fell English SC', Georgia, serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--serif)}
  body{min-height:100vh;display:flex;justify-content:center}
  main{width:100%;max-width:440px;min-height:100vh;padding:calc(44px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute)}
  .rule{height:1px;background:var(--line);margin:20px 0}
  .tag{border:1px solid var(--line2);padding:4px 8px}
  p{margin:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;border:none;cursor:pointer;
       font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.08em;text-decoration:none}
  .btn.primary{background:var(--rub);color:var(--ink);justify-content:space-between;padding:0 22px}
  .btn.solid{background:var(--rub);color:var(--ink)}
  .btn.outline{background:transparent;color:var(--parch);border:1.5px solid var(--parch)}
  .btn.link{background:transparent;color:var(--mute);min-height:48px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:17px;letter-spacing:0;text-decoration:underline;text-underline-offset:4px}
  .btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--parch);outline-offset:3px}
  .btn.opt{background:transparent;color:var(--parch);border:1.5px solid var(--line2);justify-content:flex-start;text-align:left;
           font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:0;padding:12px 16px;min-height:56px}
  .btn.opt b{font-family:var(--mono);font-size:13px;color:var(--mute);min-width:18px}
  .btn.opt:hover,.btn.outline:hover{border-color:var(--parch)}
  /* idioma */
  .lang{display:flex;gap:6px}
  .lang button{min-height:36px;min-width:44px;padding:0 10px;background:transparent;border:1px solid var(--line2);color:var(--mute);font-family:var(--mono);font-size:12px;letter-spacing:.08em;cursor:pointer}
  .lang button[aria-pressed="true"]{border-color:var(--rub);color:var(--parch)}
  /* portada */
  .logo{display:flex;align-items:flex-start;gap:4px;margin-top:8px}
  .cap{width:92px;height:104px;border:2px solid var(--rub);display:flex;align-items:center;justify-content:center;font-family:var(--sc);font-size:96px;line-height:1;color:var(--rub);padding-top:6px}
  .logo .rest{font-family:var(--sc);font-size:62px;line-height:1;padding-top:34px}
  .sub{font-size:24px;line-height:1.3;font-style:italic}
  .padel{font-size:18px;line-height:1.45;padding-left:14px;border-left:2px solid var(--rub)}
  .intro{font-size:17px;line-height:1.5;color:var(--parch2)}
  .foot{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--mute)}
  .stack{display:flex;flex-direction:column}
  /* teoría */
  .th-title{font-family:var(--sc);font-size:40px;line-height:1;margin-top:6px}
  .th-lead{font-size:18px;line-height:1.45;color:var(--parch2);margin-top:12px}
  .venn{width:100%;height:auto;margin:14px 0 4px}
  .sets{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .set{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start}
  .set i{width:12px;height:12px;border-radius:50%;margin-top:5px;display:block}
  .set b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;display:block}
  .set span{font-size:16px;line-height:1.4;color:var(--parch2)}
  .th-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);margin:20px 0 6px;text-transform:uppercase}
  .th-p{font-size:16px;line-height:1.45}
  /* pregunta */
  .prog{height:4px;background:var(--line);margin-top:22px}
  .prog > div{height:4px;background:var(--rub);transition:width .25s}
  .art{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:44px}
  .qtext{font-size:30px;line-height:1.25;margin-top:16px}
  .videtur{font-size:17px;line-height:1.5;font-style:italic;color:var(--parch2);margin-top:20px}
  .answers{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:12px}
  /* resultado */
  .eres{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:30px;padding-right:116px}
  .perfil{font-family:var(--sc);font-size:44px;line-height:1.02;margin-top:6px;padding-right:116px}
  .especie{font-size:30px;line-height:1.1;font-style:italic;color:var(--rub);padding-right:116px}
  .rasgos{font-family:var(--mono);font-size:12px;color:var(--parch2);margin-top:8px}
  .alter{font-size:17px;line-height:1.4;margin-top:10px}
  .alter b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);font-weight:400;display:block;margin-bottom:2px}
  .nivel{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:20px}
  .nivel .n{font-family:var(--mono);font-weight:600;font-size:46px;line-height:1}
  .nivel p{font-size:16px;line-height:1.35;font-style:italic;color:var(--parch2)}
  .dork{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:8px}
  .desc{font-size:17px;line-height:1.45;margin-top:16px}
  .section-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);margin:26px 0 10px}
  .eje{margin-bottom:10px}
  .eje .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;margin-bottom:4px}
  .track{position:relative;height:8px;background:var(--line)}
  .track .fill{height:8px;background:var(--parch)}
  .track .mid{position:absolute;left:50%;top:-3px;width:1px;height:14px;background:var(--mute)}
  .dom{display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;margin-bottom:6px}
  .dom .t{height:6px;background:var(--ink2)} .dom .t div{height:6px;background:var(--bar)}
  .dom.top .t div{background:var(--rub)}
  .dom .v{text-align:right;color:var(--parch2)}
  .stamp{position:absolute;top:22px;right:0;width:112px;height:112px;border-radius:50%;border:2.5px solid var(--rub);display:flex;flex-direction:column;align-items:center;justify-content:center;
         transform:rotate(-14deg);color:var(--rub);font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.1em;line-height:1.5;text-align:center}
  .stamp small{font-size:9px;font-weight:400;letter-spacing:.06em}
  .rel{position:relative}
  details{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
  summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--parch2);min-height:32px}
  .ver{font-size:15px;line-height:1.4;margin-top:12px}
  .ver span{font-family:var(--mono);font-size:11px}
  .ok{color:var(--green)} .ko{color:var(--rub)}
  .endbtns{display:flex;flex-direction:column;gap:10px;margin-top:28px}
  .donate{margin-top:26px;border:1.5px solid var(--line2);padding:18px;display:none;flex-direction:column;gap:12px}
  .donate.on{display:flex}
  .donate p{font-size:17px;line-height:1.4}
  .donate .row{display:flex;gap:10px}
  .donate .row .btn{min-height:50px;font-size:13px}
  .donate-msg{font-family:var(--mono);font-size:12px;color:var(--green);min-height:16px}
  /* visor de la imagen */
  .modal{position:fixed;inset:0;background:rgba(10,14,26,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:10}
  .modal.on{display:flex}
  .modal img{max-width:100%;max-height:72vh;border:1px solid var(--line2)}
  .modal p{font-family:var(--mono);font-size:12px;color:var(--parch2);text-align:center;max-width:360px}
  .modal .btn{max-width:360px}
</style>
</head>
<body>
<main>

  <!-- PORTADA -->
  <section class="screen on" id="s-portada">
    <div class="meta"><span>INDEX NERDITATIS</span><span>v2.0</span></div>
    <div class="rule"></div>
    <div class="lang" role="group" id="lang" aria-label="Idioma"></div>
    <div class="stack" style="gap:24px;margin-top:22px">
      <div class="logo" aria-label="Nerditas"><div class="cap" aria-hidden="true">N</div><div class="rest" aria-hidden="true">erditas</div></div>
      <p class="sub" data-t="sub"></p>
      <p class="padel" data-t="padel"></p>
      <p class="intro" data-t="intro"></p>
    </div>
    <div class="stack" style="gap:18px;margin-top:auto;padding-top:32px">
      <button class="btn primary" id="b-start" type="button"><span data-t="start"></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="foot" id="p-foot" data-t="foot"></p>
    </div>
  </section>

  <!-- TEORÍA -->
  <section class="screen" id="s-teoria">
    <div class="meta"><span>PROLEGOMENA</span><span>v2.0</span></div>
    <div class="th-title" data-t="thTitle"></div>
    <p class="th-lead" data-t="thLead"></p>
    <svg class="venn" viewBox="0 0 340 330" role="img" id="venn">
      <circle cx="122" cy="118" r="98" fill="#EDE6D6" fill-opacity=".10" stroke="#EDE6D6" stroke-width="1.5"/>
      <circle cx="218" cy="118" r="98" fill="#E2553F" fill-opacity=".12" stroke="#E2553F" stroke-width="1.5"/>
      <circle cx="170" cy="200" r="98" fill="#7FD1A8" fill-opacity=".10" stroke="#7FD1A8" stroke-width="1.5"/>
      <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#EDE6D6" text-anchor="middle">
        <text x="74" y="96" id="z-HLL"></text>
        <text x="266" y="96" id="z-LHL"></text>
        <text x="170" y="276" id="z-LLH"></text>
        <text x="170" y="84" id="z-HHL" font-weight="600" fill="#E2553F" font-size="12"></text>
        <text x="112" y="196" id="z-HLH"></text>
        <text x="228" y="196" id="z-LHH"></text>
        <text x="170" y="150" id="z-HHH" font-weight="600" font-size="12"></text>
        <text x="300" y="322" id="z-LLL" fill="#9AA3B8"></text>
      </g>
    </svg>
    <div class="sets">
      <div class="set"><i style="background:#EDE6D6"></i><div><b data-t="setE"></b><span data-t="setEd"></span></div></div>
      <div class="set"><i style="background:#E2553F"></i><div><b data-t="setO"></b><span data-t="setOd"></span></div></div>
      <div class="set"><i style="background:#7FD1A8"></i><div><b data-t="setA"></b><span data-t="setAd"></span></div></div>
    </div>
    <div class="th-h" data-t="thRaces"></div><p class="th-p" data-t="thRacesTxt"></p>
    <div class="th-h" data-t="thSub"></div><p class="th-p" data-t="thSubTxt"></p>
    <div class="th-h" data-t="thLevel"></div><p class="th-p" data-t="thLevelTxt"></p>
    <div style="margin-top:auto;padding-top:28px">
      <button class="btn primary" id="b-go" type="button"><span data-t="thGo"></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- PREGUNTA -->
  <section class="screen" id="s-pregunta">
    <div class="meta"><span id="q-num"></span><span class="tag" id="q-tag"></span></div>
    <div class="prog"><div id="q-prog" style="width:0%"></div></div>
    <div class="art" id="q-art"></div>
    <p class="qtext" id="q-text" aria-live="polite"></p>
    <p class="videtur" id="q-videtur"></p>
    <div class="answers" id="q-answers"></div>
  </section>

  <!-- RESULTADO -->
  <section class="screen" id="s-resultado">
    <div class="meta"><span data-t="res"></span><span>60 / 60</span></div>
    <div class="rel">
      <div class="eres" id="r-eres"></div>
      <div class="perfil" id="r-perfil"></div>
      <div class="especie" id="r-especie"></div>
      <div class="rasgos" id="r-rasgos"></div>
      <div class="stamp" id="r-stamp" aria-hidden="true"></div>
    </div>
    <p class="alter" id="r-alter"></p>
    <div class="nivel"><div class="n" id="r-nivel"></div><p id="r-frase"></p></div>
    <div class="dork" id="r-dork"></div>
    <p class="desc" id="r-desc"></p>
    <p class="desc" id="r-validez" style="font-style:italic;color:var(--parch2)"></p>

    <div class="section-h" data-t="axesH"></div>
    <div id="r-ejes"></div>
    <p class="rasgos" id="r-indices" style="margin-top:6px"></p>

    <div class="section-h" data-t="domH"></div>
    <div id="r-doms"></div>

    <details>
      <summary data-t="verH"></summary>
      <div id="r-ver"></div>
    </details>

    <div class="donate" id="donate">
      <p data-t="askDonate"></p>
      <div class="row"><button class="btn solid" id="b-donate-yes" type="button" data-t="donateYes"></button><button class="btn outline" id="b-donate-no" type="button" data-t="donateNo"></button></div>
    </div>
    <p class="donate-msg" id="donate-msg" aria-live="polite"></p>
    <div class="endbtns">
      <button class="btn solid" id="b-share" type="button" data-t="share"></button>
      <button class="btn outline" id="b-save" type="button" data-t="save"></button>
      <button class="btn link" id="b-again" type="button" data-t="again"></button>
    </div>
  </section>

</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <img id="m-img" alt="">
  <p data-t="saveHint"></p>
  <a class="btn solid" id="m-dl" download="nerditas.png" data-t="save"></a>
  <button class="btn link" id="m-close" type="button" data-t="close"></button>
</div>

<script>
/* Nerditas 2.0 — banco de preguntas trilingüe.
   Q(id, dominio, ejes, es, it, en)
   Ejes: I erudición · O obsesión por saberes nerd · G adaptación social (+) · g adaptación social inversa (sí = menos adaptado)
         P pedantería (índice) · E estética nerd (índice) · C coleccionismo (decide entre Leonard y Howard)
   En español las preguntas van sin «¿» inicial: es una de las bromas del test. */
const BANK = [];
function Q(id, d, ax, es, it, en){ BANK.push({id, d, ax, tipo:"si_no", t:{es, it, en}}); }

/* ---------- Filosofía ---------- */
Q("FIL-01","FIL","I","Puedes explicar el argumento ontológico de san Anselmo en menos de un minuto?","Sai spiegare l’argomento ontologico di sant’Anselmo in meno di un minuto?","Can you explain St Anselm’s ontological argument in under a minute?");
Q("FIL-02","FIL","I","Sabes qué silogismos son Barbara y Celarent?","Sai quali sillogismi sono Barbara e Celarent?","Do you know which syllogisms Barbara and Celarent are?");
Q("FIL-03","FIL","IO","Has leído entera la Crítica de la razón pura, y no sólo el prólogo?","Hai letto tutta la Critica della ragion pura, e non solo la prefazione?","Have you read the whole Critique of Pure Reason, not just the preface?");
Q("FIL-04","FIL","I","Sabes quién es Gettier y por qué complicó la definición de conocimiento?","Sai chi è Gettier e perché ha complicato la definizione di conoscenza?","Do you know who Gettier is and why he complicated the definition of knowledge?");
Q("FIL-05","FIL","O","Tienes un filósofo favorito y otro al que consideras enemigo personal?","Hai un filosofo preferito e un altro che consideri tuo nemico personale?","Do you have a favourite philosopher and another you consider a personal enemy?");
Q("FIL-06","FIL","P","Has corregido a alguien que usaba «dialéctica», «paradigma» u «ontológico» a la ligera?","Hai corretto qualcuno che usava «dialettica», «paradigma» o «ontologico» alla leggera?","Have you corrected someone for using «dialectic», «paradigm» or «ontological» loosely?");
Q("FIL-07","FIL","O","Has pensado en el barco de Teseo mientras reparabas algo tuyo?","Hai pensato alla nave di Teseo mentre riparavi qualcosa di tuo?","Have you thought about the Ship of Theseus while repairing something of yours?");
Q("FIL-08","FIL","I","Has usado «a priori», «mutatis mutandis» y «ad hoc» en la misma frase, con sentido?","Hai usato «a priori», «mutatis mutandis» e «ad hoc» nella stessa frase, con senso?","Have you used «a priori», «mutatis mutandis» and «ad hoc» in one sentence, meaningfully?");
Q("FIL-09","FIL","O","Has discutido en una cena si el problema mente-cuerpo está resuelto?","Hai discusso a cena se il problema mente-corpo sia risolto?","Have you argued at dinner about whether the mind-body problem is solved?");
Q("FIL-10","FIL","I","Sabes distinguir acto y potencia, sustancia y accidente, sin mirar apuntes?","Sai distinguere atto e potenza, sostanza e accidente, senza guardare gli appunti?","Can you tell act from potency, substance from accident, without your notes?");

/* ---------- Teología ---------- */
Q("TEO-01","TEO","I","Sabes qué es el Filioque y por qué pesó en la ruptura entre Roma y Constantinopla?","Sai cos’è il Filioque e perché ha pesato nella rottura tra Roma e Costantinopoli?","Do you know what the Filioque is and why it mattered in the split between Rome and Constantinople?");
Q("TEO-02","TEO","I","Puedes nombrar en orden los siete primeros concilios ecuménicos?","Sai elencare in ordine i primi sette concili ecumenici?","Can you name the first seven ecumenical councils in order?");
Q("TEO-03","TEO","I","Distingues transustanciación, consustanciación e impanación?","Distingui transustanziazione, consustanziazione e impanazione?","Can you tell transubstantiation, consubstantiation and impanation apart?");
Q("TEO-04","TEO","I","Has leído en latín un artículo completo de la Suma Teológica, con objeciones, sed contra y respuestas?","Hai letto in latino un articolo completo della Summa Theologiae, con obiezioni, sed contra e risposte?","Have you read a full article of the Summa Theologiae in Latin, with objections, sed contra and replies?");
Q("TEO-05","TEO","O","Tienes postura en la controversia De auxiliis (molinistas contra bañecianos)?","Hai una posizione nella controversia De auxiliis (molinisti contro bañeziani)?","Do you take a side in the De auxiliis controversy (Molinists vs Bañezians)?");
Q("TEO-06","TEO","IO","Citas el Denzinger por número sin abrirlo?","Citi il Denzinger per numero senza aprirlo?","Do you cite Denzinger by number without opening it?");
Q("TEO-07","TEO","P","Has usado «communicatio idiomatum» en una conversación no académica?","Hai usato «communicatio idiomatum» in una conversazione non accademica?","Have you used «communicatio idiomatum» in a non-academic conversation?");
Q("TEO-08","TEO","I","Sabes qué son las notas teológicas (de fide, sententia certa…)?","Sai cosa sono le note teologiche (de fide, sententia certa…)?","Do you know what theological notes are (de fide, sententia certa…)?");
Q("TEO-09","TEO","O","Te has preguntado en qué lengua se comunican los ángeles?","Ti sei chiesto in che lingua comunicano gli angeli?","Have you wondered what language angels communicate in?");
Q("TEO-10","TEO","I","Puedes situar a De Lubac, Congar y Garrigou-Lagrange en el mismo mapa?","Sai collocare De Lubac, Congar e Garrigou-Lagrange sulla stessa mappa?","Can you place De Lubac, Congar and Garrigou-Lagrange on the same map?");

/* ---------- Patrística ---------- */
Q("PAT-01","PAT","I","Sabes quiénes son los cuatro Padres que sostienen la Cátedra de San Pedro en la basílica vaticana?","Sai chi sono i quattro Padri che sostengono la Cattedra di San Pietro nella basilica vaticana?","Do you know who the four Fathers holding up the Chair of St Peter in St Peter’s Basilica are?");

    if(!need) need = ["I","O"].sort((x,y)=>c[x]-c[y])[0];
    let next = pool.find(it => !used.has(it.id) && (it.d!=="POP" || need==="C") && axes(it)[need]);
    if(!next) next = pool.find(it => !used.has(it.id) && it.d!=="POP");
    if(!next) break;
    take(next);
  }
  return shuffle(out.concat(ver, val));
}

/* ---------- Flujo ---------- */
let QS = [], idx = 0, ANS = {}, VORDER = [], LAST = null;
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0,0); }
function start(){ QS = sortear(); idx = 0; ANS = {}; VORDER = shuffle(VIDETUR); show("s-pregunta"); renderQ(); }

function renderQ(){
  const q = QS[idx], n = idx+1;
  $("q-num").textContent = T("q") + " " + n + " / " + QS.length;
  $("q-tag").textContent = DOMS[q.d][LANG][1];
  $("q-prog").style.width = (idx / QS.length * 100) + "%";
  $("q-art").textContent = T("art") + " " + roman(n);
  $("q-text").textContent = qtext(q);
  $("q-videtur").textContent = tx(VORDER[idx % VORDER.length]);
  const box = $("q-answers"); box.textContent = "";
  if(q.tipo === "ver"){
    q.o[LANG].forEach((o,i) => {
      const b = document.createElement("button"); b.type="button"; b.className="btn opt";
      const k = document.createElement("b"); k.textContent = "ABCD"[i];
      const s = document.createElement("span"); s.textContent = o;
      b.append(k, s); b.addEventListener("click", () => answer(i)); box.append(b);
    });
  } else {
    [[T("yes"),"si","btn solid"],[T("no"),"no","btn outline"],[T("ns"),"ns","btn link"]].forEach(([lab,val,cls]) => {
      const b = document.createElement("button"); b.type="button"; b.className=cls; b.textContent=lab;
      b.addEventListener("click", () => answer(val)); box.append(b);
    });
  }
}
function answer(v){ ANS[QS[idx].id] = v; idx++; if(idx < QS.length) renderQ(); else finish(); }

/* ---------- Cálculo ---------- */
function calcular(){
  const sc={I:0,O:0,A:0,P:0,E:0,C:0}, mx={I:0,O:0,A:0,P:0,E:0,C:0};
  const dom={}; DOM_KEYS.forEach(k=>dom[k]={y:0,n:0});
  let pts=0, tot=0, valYes=0, afN=0, afY=0;
  QS.forEach(q => {
    const a = ANS[q.id];
    if(q.tipo === "val"){ if(a==="si") valYes++; return; }
    if(q.tipo === "ver"){
      const ok = a === q.c;
      mx.I += 2; if(ok) sc.I += 2;
      tot++; if(ok) pts++;
      if(dom[q.d]){ dom[q.d].n++; if(ok) dom[q.d].y++; }
      return;
    }
    const ax = axes(q), si = a === "si";
    if(q.d==="POP" || ((q.d==="TEC" || q.d==="CIEN") && ax.O)){ afN++; if(si) afY++; }
    if(ax.A){ mx.A += 1; if(ax.arev ? !si : si) sc.A += 1; }
    ["I","O","P","E","C"].forEach(k => { if(ax[k]){ mx[k]++; if(si) sc[k]++; } });
    if(ax.I || ax.O || ax.P || ax.E){ tot++; if(si) pts++; }
    if(dom[q.d]){ dom[q.d].n++; if(si) dom[q.d].y++; }
  });
  const pct = k => mx[k] ? Math.round(sc[k]/mx[k]*100) : 0;
  const ejes = {E:pct("I"), O:pct("O"), A:pct("A")};
  const P = pct("P"), Est = pct("E"), Col = mx.C ? pct("C") : 0;
  const afic = afN ? Math.round(afY/afN*100) : 0;
  const nivel = tot ? Math.round(pts/tot*100) : 0;
  const key = ["E","O","A"].map(k => ejes[k]>=50?"H":"L").join("");
  const muggle = key.startsWith("LL");
  const aspirante = !muggle && nivel < 50;
  // con rasgos de… (el conjunto más cercano al 50 %)
  let rasgos = "";
  const near = ["E","O","A"].filter(k => Math.abs(ejes[k]-50) <= 5).sort((x,y)=>Math.abs(ejes[x]-50)-Math.abs(ejes[y]-50))[0];
  if(near){ const i = ["E","O","A"].indexOf(near); const alt = key.split(""); alt[i] = alt[i]==="H"?"L":"H"; const k2 = alt.join(""); if(k2 !== key) rasgos = k2; }
  // subclase: disciplina dominante (híbrida si las dos primeras están a menos de 10 puntos)
  const domPct = DOM_KEYS.map(k => ({k, v: dom[k].n ? Math.round(dom[k].y/dom[k].n*100) : 0, n: dom[k].n})).filter(x=>x.n>0).sort((a,b)=>b.v-a.v);
  const sub = [domPct[0].k]; if(domPct[1] && domPct[0].v - domPct[1].v < 10) sub.push(domPct[1].k);
  // alter ego
  let alter;
  if(muggle) alter = ejes.A >= 50 ? "georgie" : "kurt";
  else if(aspirante){
    if(sub[0]==="TEO" || sub[0]==="PAT") alter = "mary";
    else if(ejes.E < 30) alter = "zack";
    else if(ejes.A >= 50) alter = "penny";
    else alter = "missy";
  } // Geek puro: Leonard es el geek profundo (erudición ≥ 70 %); Howard, el más superficial o muy coleccionista
  else if(key==="HHH") alter = (Col >= 50 || ejes.E < 70) ? "howard" : "leonard";
  else if(key==="HLH") alter = "bernadette";
  else if(key==="HHL") alter = (ejes.A < 35 && P >= 50) ? "kripke" : (afic >= 60 && P < 50) ? "raj" : "sheldon";
  else if(key==="HLL") alter = "amy";
  else alter = "stuart";
  const frase = (ESCALA.find(([max]) => nivel <= max) || ESCALA[ESCALA.length-1])[1];
  return {ejes, P, Est, afic, nivel, key, muggle, aspirante, rasgos, domPct, sub, alter, frase, sospecha: valYes>=2};
}

/* ---------- Resultado ---------- */
function especieTxt(r){ return r.sub.map(k => DOMS[k][LANG][2]).join("-"); }
function razaTxt(r){ return RAZAS[r.key][LANG][0]; }
function eresTxt(r){ return r.aspirante ? T("youAreAsp") : T("youAre"); }

function finish(){
  LAST = calcular(); renderResult();
  $("donate-msg").textContent = "";
  $("donate").classList.toggle("on", STATS_ON);
  show("s-resultado");
}
function payload(){
  const r = LAST, resp = {};
  QS.forEach(q => { const a = ANS[q.id]; resp[q.id] = q.tipo==="ver" ? (a===q.c?1:0) : (a==="si"?1:(a==="ns"?-1:0)); });
  const dom = {}; r.domPct.forEach(x => dom[x.k] = x.v);
  return {
    lang: LANG, raza: (r.aspirante ? "aspirante " : "") + RAZAS[r.key].es[0], sub: r.sub.join("-"),
    alter: ALTER[r.alter].n, nivel: String(r.nivel),
    datos: JSON.stringify({v:"2.1", E:r.ejes.E, O:r.ejes.O, A:r.ejes.A, P:r.P, Est:r.Est, afic:r.afic, sospecha:r.sospecha, dom, resp})
  };
}
async function donar(){
  $("donate").classList.remove("on");
  const p = payload();
  if(navigator.onLine){
    try { await enviar(p); $("donate-msg").textContent = T("thanks"); return; } catch(e){}
  }
  const c = cola(); c.push(p); setCola(c); $("donate-msg").textContent = T("queued");
}

function renderResult(){
  const r = LAST; if(!r) return;
  $("r-eres").textContent = eresTxt(r);
  $("r-perfil").textContent = razaTxt(r);
  $("r-especie").textContent = especieTxt(r);
  $("r-rasgos").textContent = r.rasgos ? T("traits") + " " + RAZAS[r.rasgos][LANG][0] : "";
  const al = ALTER[r.alter];
  $("r-alter").textContent = "";
  const ab = document.createElement("b"); ab.textContent = T("alter").toUpperCase();
  $("r-alter").append(ab, document.createTextNode(al.n + " — " + al[LANG]));
  $("r-nivel").textContent = r.nivel;
  $("r-frase").textContent = r.frase[LANG];
  $("r-dork").textContent = r.key==="LHL" ? T("dork") : "";
  $("r-desc").textContent = RAZAS[r.key][LANG][1];
  const st = $("r-stamp"); st.textContent = "";
  const sl = r.sospecha ? T("stampKo") : T("stampOk");
  [sl[0], sl[1]].forEach(l => { const s=document.createElement("span"); s.textContent=l; st.append(s); });
  const sm = document.createElement("small"); sm.textContent = sl[2]; st.append(sm);
  $("r-validez").textContent = r.sospecha ? T("suspect") : "";

  const ej = $("r-ejes"); ej.textContent = "";
  [["E",T("axE")],["O",T("axO")],["A",T("axA")]].forEach(([k,lab]) => {
    const w = document.createElement("div"); w.className="eje";
    const l = document.createElement("div"); l.className="lab";
    const a = document.createElement("span"); a.textContent = lab;
    const b = document.createElement("span"); b.textContent = r.ejes[k] + " %";
    l.append(a,b);
    const t = document.createElement("div"); t.className="track"; t.setAttribute("role","img"); t.setAttribute("aria-label", lab + ": " + r.ejes[k] + " %");
    const f = document.createElement("div"); f.className="fill"; f.style.width = r.ejes[k] + "%";
    const m = document.createElement("div"); m.className="mid";
    t.append(f,m); w.append(l,t); ej.append(w);
  });
  $("r-indices").textContent = T("pedant") + " " + r.P + " % · " + T("aesth") + " " + r.Est + " %";

  const dm = $("r-doms"); dm.textContent = "";
  r.domPct.forEach((x,i) => {
    const row = document.createElement("div"); row.className = "dom" + (i===0?" top":"");
    const a = document.createElement("span"); a.textContent = DOMS[x.k][LANG][0];
    const t = document.createElement("div"); t.className="t";
    const f = document.createElement("div"); f.style.width = x.v + "%"; t.append(f);
    const v = document.createElement("span"); v.className="v"; v.textContent = x.v + "%";
    row.append(a,t,v); dm.append(row);
  });

  const vr = $("r-ver"); vr.textContent = "";
  QS.filter(q=>q.tipo==="ver").forEach(q => {
    const p = document.createElement("p"); p.className="ver";
    const ok = ANS[q.id] === q.c;
    const mark = document.createElement("span"); mark.className = ok?"ok":"ko"; mark.textContent = ok ? "BENE  " : "MALE  ";
    p.append(mark, document.createTextNode((LANG==="es"?"¿":"") + q.t[LANG] + " → " + q.o[LANG][q.c]));
    vr.append(p);
  });
}

/* ---------- Tarjeta-imagen para compartir ---------- */
function wrap(ctx, text, x, y, maxW, lh){
  const words = text.split(" "); let line = ""; let yy = y;
  for(const w of words){ const test = line ? line + " " + w : w; if(ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; } else line = test; }
  if(line) ctx.fillText(line, x, yy); return yy + lh;
}
async function tarjeta(){
  const r = LAST;
  try { await Promise.all(["44px 'IM Fell English SC'","italic 40px 'IM Fell English'","40px 'IM Fell English'","600 30px 'JetBrains Mono'"].map(f => document.fonts.load(f))); } catch(e){}
  const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"); const M=84;
  x.fillStyle="#121A2E"; x.fillRect(0,0,W,H);
  x.fillStyle="#9AA3B8"; x.font="400 26px 'JetBrains Mono', monospace"; x.textBaseline="alphabetic";
  x.fillText("INDEX NERDITATIS · " + T("res"), M, 110);
  x.fillStyle="#2E3854"; x.fillRect(M,138,W-2*M,2);
  // sello
  x.save(); x.translate(W-M-110, 290); x.rotate(-14*Math.PI/180);
  x.strokeStyle="#E2553F"; x.lineWidth=5; x.beginPath(); x.arc(0,0,105,0,Math.PI*2); x.stroke();
  x.fillStyle="#E2553F"; x.textAlign="center"; x.font="600 26px 'JetBrains Mono', monospace";
  const sl = r.sospecha ? T("stampKo") : T("stampOk");
  x.fillText(sl[0],0,-12); x.fillText(sl[1],0,22); x.font="400 15px 'JetBrains Mono', monospace"; x.fillText(sl[2],0,50);
  x.restore(); x.textAlign="left";
  // raza
  x.fillStyle="#9AA3B8"; x.font="400 28px 'JetBrains Mono', monospace"; x.fillText(eresTxt(r), M, 230);
  x.fillStyle="#EDE6D6"; x.font="400 104px 'IM Fell English SC', Georgia, serif";
  let y = wrap(x, razaTxt(r), M, 340, W-2*M-240, 104);
  x.fillStyle="#E2553F"; x.font="italic 64px 'IM Fell English', Georgia, serif";
  y = wrap(x, especieTxt(r), M, y-14, W-2*M, 70);
  if(r.rasgos){ x.fillStyle="#C9C2B2"; x.font="400 26px 'JetBrains Mono', monospace"; x.fillText(T("traits") + " " + RAZAS[r.rasgos][LANG][0], M, y+4); y += 40; }
  // alter ego
  y += 30; x.fillStyle="#9AA3B8"; x.font="400 24px 'JetBrains Mono', monospace"; x.fillText(T("alter").toUpperCase(), M, y);
  x.fillStyle="#EDE6D6"; x.font="400 44px 'IM Fell English', Georgia, serif"; y = wrap(x, ALTER[r.alter].n, M, y+52, W-2*M, 50);
  // nivel
  y += 20; x.fillStyle="#2E3854"; x.fillRect(M,y,W-2*M,2);
  x.fillStyle="#EDE6D6"; x.font="600 120px 'JetBrains Mono', monospace"; x.fillText(String(r.nivel), M, y+140);
  const nw = x.measureText(String(r.nivel)).width;
  x.fillStyle="#C9C2B2"; x.font="italic 36px 'IM Fell English', Georgia, serif";
  wrap(x, r.frase[LANG], M+nw+40, y+70, W-2*M-nw-40, 44);
  y += 190; x.fillStyle="#2E3854"; x.fillRect(M,y,W-2*M,2);
  // barras
  y += 60;
  [["E",T("axE")],["O",T("axO")],["A",T("axA")]].forEach(([k,lab]) => {
    x.fillStyle="#EDE6D6"; x.font="400 28px 'JetBrains Mono', monospace"; x.fillText(lab, M, y);
    x.textAlign="right"; x.fillText(r.ejes[k]+" %", W-M, y); x.textAlign="left";
    x.fillStyle="#2E3854"; x.fillRect(M, y+16, W-2*M, 18);
    x.fillStyle="#EDE6D6"; x.fillRect(M, y+16, (W-2*M)*r.ejes[k]/100, 18);
    x.fillStyle="#9AA3B8"; x.fillRect(M+(W-2*M)/2-1, y+8, 3, 34);
    y += 84;
  });
  // pie
  x.fillStyle="#E2553F"; x.strokeStyle="#E2553F"; x.lineWidth=3; x.strokeRect(M, H-150, 64, 72);
  x.font="400 66px 'IM Fell English SC', Georgia, serif"; x.textAlign="center"; x.fillText("N", M+32, H-92); x.textAlign="left";
  x.fillStyle="#EDE6D6"; x.font="400 44px 'IM Fell English SC', Georgia, serif"; x.fillText("erditas", M+70, H-98);
  x.fillStyle="#9AA3B8"; x.font="400 22px 'JetBrains Mono', monospace";
  const where = (location.protocol.startsWith("http") ? location.host + location.pathname.replace(/index\.html$/,"") : "Index nerditatis v2.0");
  x.fillText(where, M, H-56);
  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}
function shareText(){ const r = LAST; return T("shareTxt") + " " + razaTxt(r) + " (" + especieTxt(r) + "), " + T("level") + " " + r.nivel + ". " + T("alter") + ": " + ALTER[r.alter].n + "."; }
let lastURL = null;
function openModal(blob){
  if(lastURL) URL.revokeObjectURL(lastURL);
  lastURL = URL.createObjectURL(blob);
  $("m-img").src = lastURL; $("m-img").alt = shareText(); $("m-dl").href = lastURL;
  $("modal").classList.add("on"); $("m-close").focus();
}
async function compartir(){
  if(!LAST) return;
  const blob = await tarjeta(); if(!blob) return;
  const file = new File([blob], "nerditas.png", {type:"image/png"});
  try {
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text: shareText(), title:"Nerditas"}); return; }
  } catch(e){ if(e && e.name === "AbortError") return; }
  openModal(blob);
}
async function guardarImagen(){ if(!LAST) return; const blob = await tarjeta(); if(blob) openModal(blob); }

/* ---------- Botones ---------- */
$("b-start").addEventListener("click", () => show("s-teoria"));
$("b-go").addEventListener("click", start);
$("b-again").addEventListener("click", start);
$("b-share").addEventListener("click", compartir);
$("b-save").addEventListener("click", guardarImagen);
$("b-donate-yes").addEventListener("click", donar);
$("b-donate-no").addEventListener("click", () => { $("donate").classList.remove("on"); $("donate-msg").textContent = T("declined"); });
$("m-close").addEventListener("click", () => $("modal").classList.remove("on"));
})();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
